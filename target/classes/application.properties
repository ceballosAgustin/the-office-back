spring.application.name=the-office-back

# ==========================================
# 1. SERVIDOR
# ==========================================
server.port=${PORT:8080}

# ==========================================
# 2. BASE DE DATOS (MySQL)
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# 3. JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ==========================================
# 4. JWT CONFIGURATION
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# 5. SEGURIDAD Y AUTH
# ==========================================
app.auth.admin-setup-token=${ADMIN_SETUP_TOKEN:}
app.auth.registration-enabled=${AUTH_REGISTRATION_ENABLED:true}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4321,http://localhost:3000,http://localhost:5173,http://127.0.0.1:4321,http://127.0.0.1:3000,http://127.0.0.1:5173}

# ==========================================
# 6. CLOUDINARY (Gestión de Imágenes)
# ==========================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder=${CLOUDINARY_FOLDER:the-office/products}

# ==========================================
# 7. SUBIDA DE ARCHIVOS
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# 8. WHATSAPP
# ==========================================
app.whatsapp.phone-number=${WHATSAPP_PHONE}
