# ==========================================
# PERFIL DE PRODUCCIÓN (prod)
# ==========================================

# 1. JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# 2. Servidor y Proxy HTTPS
server.forward-headers-strategy=framework

# 3. Seguridad y Auth
app.auth.registration-enabled=${AUTH_REGISTRATION_ENABLED:false}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://theofficeba.ar,https://www.theofficeba.ar}

# 4. Rate limiting: la API (api.theofficeba.ar) pasa por Cloudflare (Proxied) y luego por Railway,
# asi que getRemoteAddr() y el ultimo valor de X-Forwarded-For son IPs de proxies compartidas.
# Cloudflare envia la IP real del cliente en CF-Connecting-IP.
# Si se quita el proxy de Cloudflare, cambiar a X-Forwarded-For via RATE_LIMIT_CLIENT_IP_HEADER.
app.rate-limit.client-ip-header=${RATE_LIMIT_CLIENT_IP_HEADER:CF-Connecting-IP}
