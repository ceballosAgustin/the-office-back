spring.application.name=the-office-back

# ==========================================
# 1. SERVIDOR
# ==========================================
server.port=${PORT:8080}

# ==========================================
# 2. BASE DE DATOS (MySQL)
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# 3. JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Evita el patron N+1 en relaciones lazy (carga por lotes de hasta 50 ids); no cambia resultados
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Todo el mapeo a DTO ocurre dentro de servicios @Transactional; no se mantiene la sesion abierta durante la vista
spring.jpa.open-in-view=false
# Tope de tamano de pagina aceptado por Pageable (el frontend usa size=50)
spring.data.web.pageable.max-page-size=100

# ==========================================
# 4. JWT CONFIGURATION
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# 5. SEGURIDAD Y AUTH
# ==========================================
app.auth.admin-setup-token=${ADMIN_SETUP_TOKEN:}
app.auth.registration-enabled=${AUTH_REGISTRATION_ENABLED:true}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4321,http://localhost:3000,http://localhost:5173,http://127.0.0.1:4321,http://127.0.0.1:3000,http://127.0.0.1:5173}

# ==========================================
# 6. CLOUDINARY (Gestión de Imágenes)
# ==========================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder=${CLOUDINARY_FOLDER:the-office/products}

# ==========================================
# 7. SUBIDA DE ARCHIVOS
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# 8. WHATSAPP
# ==========================================
app.whatsapp.phone-number=${WHATSAPP_PHONE}

# ==========================================
# 9. LIMITE DE PETICIONES (rate limiting en memoria, por IP)
# ==========================================
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
# Encabezado del que leer la IP del cliente (vacio = request.getRemoteAddr()). Se usa la ULTIMA entrada.
app.rate-limit.client-ip-header=${RATE_LIMIT_CLIENT_IP_HEADER:}
app.rate-limit.max-tracked-keys=10000
app.rate-limit.login.max-requests=10
app.rate-limit.login.window-seconds=60
app.rate-limit.setup-admin.max-requests=5
app.rate-limit.setup-admin.window-seconds=60
app.rate-limit.inquiries.max-requests=20
app.rate-limit.inquiries.window-seconds=600
